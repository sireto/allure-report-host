name: 'Publish Allure Report'
description: 'Uploads an Allure report to the central report host'
inputs:
  serverUrl:
    description: 'API endpoint for report upload'
    required: true
  serverApiKey:
    description: 'API key for authentication'
    required: true
  githubToken:
    description: 'GitHub token for posting commit status'
    required: false
    default: ${{ github.token }}
  projectName:
    description: 'Project name'
    required: true
  branch:
    description: 'Branch name'
    required: true
  reportName:
    description: 'Report name'
    required: true
  reportType:
    description: 'Report type (allure/raw)'
    required: false
    default: 'allure'
  path:
    description: 'Path to allure-results folder or .zip file'
    required: true
  testResult:
    description: 'Test exit code (0=success, nonzero=failure). Used for commit status state.'
    required: false
  testsPassed:
    description: 'Passed test count. Auto-detected from allure-results JSON if omitted.'
    required: false
  testsFailed:
    description: 'Failed test count. Auto-detected from allure-results JSON if omitted.'
    required: false
  publishCommitCheck:
    description: 'Publish a GitHub Check Run with report summary and link'
    required: false
    default: 'true'
  checkNamePrefix:
    description: 'Prefix used for the GitHub check run name'
    required: false
    default: 'Allure Report'
outputs:
  reportUrl:
    description: 'Absolute URL to the uploaded report'
    value: ${{ steps.upload.outputs.report_url }}
runs:
  using: "composite"
  steps:
    - name: Validate inputs and detect test counts
      id: pre
      shell: bash
      run: |
        # --- input validation ---
        if [[ -z "${{ inputs.serverUrl }}" ]]; then
          echo "::error::serverUrl is required"; exit 1
        fi
        if [[ -z "${{ inputs.serverApiKey }}" ]]; then
          echo "::error::serverApiKey is required"; exit 1
        fi
        if [[ "${{ inputs.reportType }}" != "allure" && "${{ inputs.reportType }}" != "raw" ]]; then
          echo "::error::reportType must be 'allure' or 'raw'"; exit 1
        fi

        path="${{ inputs.path }}"
        if [[ ! -d "$path" && ! ( -f "$path" && "$path" == *.zip ) ]]; then
          echo "::warning::path '$path' not found – skipping upload"
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "skip=false" >> "$GITHUB_OUTPUT"

        # --- passed/failed: use provided values, or auto-detect from allure JSON ---
        passed="${{ inputs.testsPassed }}"
        failed="${{ inputs.testsFailed }}"

        if [[ "${{ inputs.reportType }}" == "allure" && -d "$path" ]]; then
          if [[ -z "$passed" ]]; then
            passed=$(find "$path" -name "*-result.json" \
              -exec grep -lE '"status"\s*:\s*"passed"' {} \; 2>/dev/null | wc -l | tr -d ' ')
          fi
          if [[ -z "$failed" ]]; then
            failed=$(find "$path" -name "*-result.json" \
              -exec grep -lE '"status"\s*:\s*"(failed|broken)"' {} \; 2>/dev/null | wc -l | tr -d ' ')
          fi
        fi

        echo "passed=${passed:-0}" >> "$GITHUB_OUTPUT"
        echo "failed=${failed:-0}" >> "$GITHUB_OUTPUT"

    - name: Upload report
      id: upload
      if: ${{ steps.pre.outputs.skip != 'true' }}
      shell: bash
      continue-on-error: true
      run: |
        set -euo pipefail

        run_id="${GITHUB_SHA}/${GITHUB_RUN_ID}"

        response=$(bash "$GITHUB_ACTION_PATH/scripts/publish-report.sh" \
          --url "${{ inputs.serverUrl }}" \
          --key "${{ inputs.serverApiKey }}" \
          --run-id "$run_id" \
          "${{ inputs.projectName }}" \
          "${{ inputs.branch }}" \
          "${{ inputs.reportName }}" \
          "${{ inputs.reportType }}" \
          "${{ inputs.path }}" 2>&1)

        echo "$response"

        server_url="${{ inputs.serverUrl }}"
        server_url="${server_url%/}"
        report_url="$(printf '%s\n' "$response" | grep -oE '"url"[[:space:]]*:[[:space:]]*"[^"]+"' | head -1 | sed -E 's/^"url"[[:space:]]*:[[:space:]]*"//; s/"$//')"
        if [[ -n "$report_url" ]]; then
          if [[ "$report_url" == http://* || "$report_url" == https://* ]]; then
            echo "report_url=${report_url}" >> "$GITHUB_OUTPUT"
          else
            echo "report_url=${server_url}${report_url}" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "report_url=${server_url}/${{ inputs.projectName }}/${{ inputs.branch }}/${{ inputs.reportName }}/latest/index.html" >> "$GITHUB_OUTPUT"
        fi

    - name: Publish commit check
      if: ${{ inputs.publishCommitCheck == 'true' }}
      shell: bash
      run: |
        set -euo pipefail

        if [[ -z "${{ inputs.githubToken }}" ]]; then
          echo "::warning::githubToken is empty; skipping GitHub check run publication"
          exit 0
        fi

        passed="${{ steps.pre.outputs.passed }}"
        failed="${{ steps.pre.outputs.failed }}"
        test_result="${{ inputs.testResult }}"
        report_url="${{ steps.upload.outputs.report_url }}"
        report_type="${{ inputs.reportType }}"
        check_name="${{ inputs.checkNamePrefix }} / ${{ inputs.reportName }}"

        if [[ -z "$report_url" ]]; then
          server_url="${{ inputs.serverUrl }}"
          server_url="${server_url%/}"
          report_url="${server_url}/${{ inputs.projectName }}/${{ inputs.branch }}/${{ inputs.reportName }}/latest/index.html"
        fi

        if [[ -n "$test_result" && "$test_result" != "0" ]]; then
          conclusion="failure"
        elif [[ "${failed:-0}" =~ ^[0-9]+$ && "${failed:-0}" -gt 0 ]]; then
          conclusion="failure"
        else
          conclusion="success"
        fi

        if [[ "$report_type" == "allure" ]]; then
          title="Passed ${passed:-0}, Failed ${failed:-0}"
          printf -v summary '%s\n\n%s\n%s\n%s\n%s\n%s' \
            "Report name: ${{ inputs.reportName }}" \
            "Project: ${{ inputs.projectName }}" \
            "Branch: ${{ inputs.branch }}" \
            "Type: ${report_type}" \
            "Results: Passed ${passed:-0}, Failed ${failed:-0}" \
            "Open report: ${report_url}"
        else
          title="Raw report uploaded"
          printf -v summary '%s\n\n%s\n%s\n%s\n%s' \
            "Report name: ${{ inputs.reportName }}" \
            "Project: ${{ inputs.projectName }}" \
            "Branch: ${{ inputs.branch }}" \
            "Type: ${report_type}" \
            "Open report: ${report_url}"
        fi

        payload="$(jq -nc \
          --arg name "${check_name}" \
          --arg head_sha "${GITHUB_SHA}" \
          --arg details_url "${report_url}" \
          --arg title "${title}" \
          --arg summary "${summary}" \
          --arg conclusion "${conclusion}" \
          '{
            name: $name,
            head_sha: $head_sha,
            status: "completed",
            conclusion: $conclusion,
            details_url: $details_url,
            output: {
              title: $title,
              summary: $summary
            }
          }')"

        response_file="${RUNNER_TEMP}/allure-check-run-response.json"
        http_code="$(curl -sS -o "${response_file}" -w '%{http_code}' \
          -X POST "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/check-runs" \
          -H "Authorization: Bearer ${{ inputs.githubToken }}" \
          -H "Accept: application/vnd.github+json" \
          -H "Content-Type: application/json" \
          --data "${payload}" || true)"

        if [[ ! "${http_code}" =~ ^[0-9]{3}$ ]] || [[ "${http_code}" -lt 200 || "${http_code}" -ge 300 ]]; then
          echo "::warning::Failed to publish GitHub check run (HTTP ${http_code:-unknown}). Ensure workflow permissions include checks: write."
          if [[ -f "${response_file}" ]]; then
            cat "${response_file}" >&2
          fi
        fi
