name: 'Publish Allure Report'
description: 'Uploads an Allure report to the central report host'
inputs:
  serverUrl:
    description: 'API endpoint for report upload'
    required: true
  serverApiKey:
    description: 'API key for authentication'
    required: true
  projectName:
    description: 'Project name'
    required: true
  branch:
    description: 'Branch name'
    required: true
  reportName:
    description: 'Report name'
    required: true
  reportType:
    description: 'Report type (allure/raw)'
    required: false
    default: 'allure'
  path:
    description: 'Path to allure-results or zip'
    required: true
  testResult:
    description: 'Test result exit code (0=success, nonzero=failure)'
    required: false 
  testsPassed:
    description: 'Number of passed tests'
    required: false
  testsFailed:
    description: 'Number of failed tests'
    required: false
runs:
  using: "composite"
  steps:
    - name: Check for Allure results
      shell: bash
      run: |
        if [ ! -d "${{ inputs.path }}" ]; then
          echo "No Allure results found, skipping upload"
          exit 0
        fi

    - name: Run publish report script
      id: publish-allure-report
      shell: bash
      run: |
        bash ./scripts/publish-report.sh \
          --url "${{ inputs.serverUrl }}" \
          --key "${{ inputs.serverApiKey }}" \
          "${{ inputs.projectName }}" \
          "${{ inputs.branch }}" \
          "${{ inputs.reportName }}" \
          "${{ inputs.reportType }}" \
          "${{ inputs.path }}"

    - name: Set commit status with Allure summary
      if: always()
      uses: actions/github-script@v6
      with:
        script: |
          const sha = context.sha;

          const passed = "${{ inputs.testsPassed || '0' }}";
          const failed = "${{ inputs.testsFailed || '0' }}";
          const exitCode = "${{ inputs.testResult || '1' }}";

          const state = exitCode === "0" ? "success" : "failure";
          const description = `Tests ✓${passed} ✗${failed}`.slice(0, 140);

          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: sha,
            state: state,
            context: "allure-report",
            description: description,
            target_url: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
          });

    - name: Write test summary
      shell: bash
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "✅ Passed: ${{ inputs.testsPassed }}" >> $GITHUB_STEP_SUMMARY
        echo "❌ Failed: ${{ inputs.testsFailed }}" >> $GITHUB_STEP_SUMMARY